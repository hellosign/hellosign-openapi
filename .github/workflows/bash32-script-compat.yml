name: Bash 3.2 script compatibility

on:
  push:
    branches: [ main ]
    paths: &script-paths
      - bin/check-bash32
      - bin/docker-run
      - bin/docker-user-args
      - bin/normalize-sdk-modes
      - bin/php
      - bin/php-in-docker
      - bin/sandbox-dotnet
      - bin/sandbox-java
      - bin/sandbox-node
      - bin/sandbox-ruby
      - sdks/*/bin/dotnet
      - sdks/*/bin/gradle
      - sdks/*/bin/node
      - sdks/*/bin/php
      - sdks/*/bin/php-8
      - sdks/*/bin/python
      - sdks/*/bin/ruby
      - sdks/*/run-build
      - .github/workflows/bash32-script-compat.yml
  pull_request:
    branches: [ main ]
    paths: *script-paths

permissions:
  contents: read

jobs:
  bash32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Check SDK scripts on Bash 3.2
        run: ./bin/check-bash32
