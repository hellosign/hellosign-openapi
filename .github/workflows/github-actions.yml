    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - *configure-aws
      - *get-docker-secrets

      - name: Build OpenAPI Spec
        run: ./build

      - name: Build Ruby SDK
        run: ./generate-sdks -t ruby

      - name: Ensure no changes in Generated Code
        run: ./bin/check-clean-git-status ruby

  nodejs-sdk-build:
